<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>POLA XAT Modern Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #000000;
      color: #34d399;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }
    #ambientCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }
    .player-deck {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, rgba(8, 23, 14, 0.95) 0%, rgba(3, 12, 6, 0.95) 50%, rgba(1, 4, 2, 0.98) 100%);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 50px rgba(16, 185, 129, 0.18);
      display: flex;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      transition: all 0.3s;
    }
    .status-dot.active {
      box-shadow: 0 0 14px #34d399;
    }
    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 2.5px;
      color: #34d399;
      text-shadow: 0 0 14px rgba(16, 185, 129, 0.5);
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #6ee7b7;
    }
    .status-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    .status-badge-dot.live {
      opacity: 1;
      animation: ping 1.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes ping {
      75%, 100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }
    .screen-wrapper {
      position: relative;
      height: 94px;
      width: 100%;
      background: #020704;
      border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.25);
      overflow: hidden;
      box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.85);
    }
    #oscCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .crt-scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.45) 50%),
                  linear-gradient(90deg, rgba(16, 185, 129, 0.03), rgba(0, 0, 0, 0.01), rgba(16, 185, 129, 0.03));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 2;
      opacity: 0.4;
    }
    .screen-tag-l {
      position: absolute;
      top: 8px;
      left: 10px;
      z-index: 3;
      font-family: 'JetBrains Mono', monospace;
      font-size: 8.5px;
      color: rgba(52, 211, 153, 0.9);
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }
    .screen-tag-r {
      position: absolute;
      top: 8px;
      right: 10px;
      z-index: 3;
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      padding: 2px 8px;
      border-radius: 9999px;
      border: 1px solid rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
      font-weight: 800;
      letter-spacing: 1.5px;
      transition: all 0.2s;
    }
    .screen-tag-r.live {
      background: rgba(16, 185, 129, 0.22);
      border-color: rgba(52, 211, 153, 0.6);
      color: #a7f3d0;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
    }
    .track-deck {
      background: rgba(2, 11, 6, 0.9);
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.2);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: inset 0 1px 6px rgba(0, 0, 0, 0.6);
    }
    .track-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .track-name {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #a7f3d0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }
    .track-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      white-space: nowrap;
    }
    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .progress-bar-groove {
      position: relative;
      height: 8px;
      width: 100%;
      background: #021509;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.9);
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #059669, #10b981, #34d399);
      border-radius: 9999px;
      box-shadow: 0 0 10px #10b981;
      pointer-events: none;
    }
    .progress-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      left: 0%;
      width: 14px;
      height: 14px;
      background: #000000;
      border: 2px solid #34d399;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      pointer-events: none;
      transition: transform 0.1s;
    }
    .progress-bar-groove:hover .progress-thumb {
      transform: translate(-50%, -50%) scale(1.25);
    }
    .time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.8px;
    }
    .time-current {
      font-weight: 700;
      color: #34d399;
    }
    .bitrate-tag {
      font-size: 8.5px;
      color: rgba(52, 211, 153, 0.5);
      letter-spacing: 1.5px;
    }
    .time-total {
      color: rgba(52, 211, 153, 0.75);
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 4px 0;
    }
    .btn-step {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #031409;
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.15);
      transition: all 0.15s ease;
      outline: none;
    }
    .btn-step:hover {
      border-color: #34d399;
      background: rgba(16, 185, 129, 0.2);
      transform: scale(1.05);
    }
    .btn-step:active {
      transform: scale(0.95);
    }
    .btn-play {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #10b981;
      border: none;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.7);
      transition: all 0.15s ease;
      outline: none;
    }
    .btn-play:hover {
      transform: scale(1.08);
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.9);
    }
    .btn-play:active {
      transform: scale(0.95);
    }
    .btn-play svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
    .btn-step svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .playlist-wrap {
      background: rgba(2, 9, 5, 0.85);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    .playlist-header {
      padding: 10px 14px;
      background: rgba(5, 21, 10, 0.9);
      border-bottom: 1px solid rgba(16, 185, 129, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #34d399;
    }
    .playlist-scroll {
      max-height: 180px;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .playlist-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .playlist-scroll::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.35);
      border-radius: 9999px;
    }
    .track-row {
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(16, 185, 129, 0.04);
      border: 1px solid transparent;
      color: rgba(52, 211, 153, 0.85);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .track-row:hover {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.2);
    }
    .track-row.active {
      background: #10b981;
      color: #000000;
      font-weight: 700;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.35);
      border-color: transparent;
    }
    .track-row-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding-right: 8px;
    }
    .track-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }
    .track-idx {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.1);
      color: rgba(52, 211, 153, 0.7);
      flex-shrink: 0;
    }
    .track-row.active .track-idx {
      background: rgba(0, 0, 0, 0.25);
      color: #000000;
      font-weight: 800;
    }
    .eq-anim {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 12px;
    }
    .eq-bar {
      width: 2px;
      background: #000000;
      border-radius: 9999px;
    }
    @keyframes eq1 { 0%, 100% { height: 3px; } 50% { height: 12px; } }
    @keyframes eq2 { 0%, 100% { height: 11px; } 50% { height: 4px; } }
    @keyframes eq3 { 0%, 100% { height: 5px; } 50% { height: 13px; } }
    .eq-bar:nth-child(1) { animation: eq1 0.6s infinite ease-in-out; }
    .eq-bar:nth-child(2) { animation: eq2 0.48s infinite ease-in-out; }
    .eq-bar:nth-child(3) { animation: eq3 0.72s infinite ease-in-out; }
  </style>
</head>
<body>
  <!-- Ambient Particle Aura Canvas -->
  <canvas id="ambientCanvas"></canvas>

  <!-- Player Shell Deck -->
  <main class="player-deck">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="status-dot" id="headerDot"></div>
        <h1 class="brand-title">POLA XAT</h1>
      </div>
      <div class="status-badge">
        <div class="status-badge-dot" id="statusDot"></div>
        <span id="statusText">STANDBY</span>
      </div>
    </header>

    <!-- Spectrum Visualizer Screen -->
    <section class="screen-wrapper" aria-label="Visualizer Screen">
      <div class="crt-scanlines"></div>
      <div class="screen-tag-l">
        <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#34d399;transition:opacity 0.2s;" id="oscDot"></span>
        <span>SPECTRUM</span>
      </div>
      <div class="screen-tag-r" id="livePill">STANDBY</div>
      <canvas id="oscCanvas"></canvas>
    </section>

    <!-- Track & Progress Bar -->
    <section class="track-deck">
      <div class="track-info-row">
        <span class="track-name" id="trackName">Bahtın kara, ey kalbim</span>
        <span class="track-badge" id="trackCount">01 / 03</span>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar-groove" id="progressGroove">
          <div class="progress-bar-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
        <div class="time-row">
          <span class="time-current" id="timeCurrent">00:00</span>
          <span class="bitrate-tag">320 KBPS // STEREO</span>
          <span class="time-total" id="timeTotal">00:00</span>
        </div>
      </div>
    </section>

    <!-- Controls (PREV, PLAY/PAUSE, NEXT) -->
    <nav class="controls" aria-label="Audio Controls">
      <button type="button" class="btn-step" id="prevBtn" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 19V5h2v14H5z"/></svg>
      </button>
      <button type="button" class="btn-play" id="playBtn" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button type="button" class="btn-step" id="nextBtn" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zm14 1v14h-2V5h2z"/></svg>
      </button>
    </nav>

    <!-- Playlist Section -->
    <section class="playlist-wrap" aria-label="Tracklist">
      <div class="playlist-header">
        <div style="display:flex;align-items:center;gap:6px;font-weight:700;">
          <span style="width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 6px #10b981;"></span>
          <span style="font-family:'JetBrains Mono',monospace;letter-spacing:1.5px;font-size:10px;">TRACKLIST</span>
        </div>
        <span style="font-family:'JetBrains Mono',monospace;padding:2px 8px;border-radius:9999px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);font-size:9px;font-weight:700;" id="playlistCounter">
          01 / 03
        </span>
      </div>
      <div class="playlist-scroll" id="playlistItems"></div>
    </section>
  </main>

  <audio id="audioEl" preload="auto" crossorigin="anonymous"></audio>

  <script>
    // 3 Selected Tracks
    const TRACKS = [
      { id: 1, title: 'Chasing The Light', url: 'https://audio.jukehost.co.uk/01a0ded7-e53d-7242-88ed-d17a7c1bd33b' },
      { id: 2, title: 'Crashing To The Ground', url: 'https://audio.jukehost.co.uk/01a0ded7-e4e3-70b0-ae1b-61f4abe3b6ea' },
      { id: 3, title: 'Dance in Dark', url: 'https://audio.jukehost.co.uk/01a0ded7-e4d9-73f2-879b-ffb79782a2b4' },
      { id: 4, title: 'Spark in Dark', url: 'hhttps://audio.jukehost.co.uk/01a0ded7-e4da-73f5-b5b6-e36ed6dd9201' },
      { id: 5, title: 'Unstoppable Tonight', url: 'https://audio.jukehost.co.uk/01a0ded7-e53d-7056-9ecb-21313220f99c' }, 
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let isSeeking = false;
    let audioCtx = null;
    let analyser = null;
    let sourceConnected = false;

    const audioEl = document.getElementById('audioEl');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const trackName = document.getElementById('trackName');
    const trackCount = document.getElementById('trackCount');
    const playlistCounter = document.getElementById('playlistCounter');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeTotal = document.getElementById('timeTotal');
    const progressGroove = document.getElementById('progressGroove');
    const progressFill = document.getElementById('progressFill');
    const progressThumb = document.getElementById('progressThumb');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const headerDot = document.getElementById('headerDot');
    const livePill = document.getElementById('livePill');
    const oscDot = document.getElementById('oscDot');
    const playlistItems = document.getElementById('playlistItems');

    // 1. Soothing Ambient Particle Aura Background
    (function initAmbient() {
      const canvas = document.getElementById('ambientCanvas');
      const ctx = canvas.getContext('2d');
      const count = 42;
      let particles = [];

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);

        particles = [];
        for (let i = 0; i < count; i++) {
          const baseAlpha = 0.1 + Math.random() * 0.28;
          particles.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            vx: (Math.random() - 0.5) * 0.3,
            vy: -0.15 - Math.random() * 0.35,
            size: 1.2 + Math.random() * 2.2,
            alpha: baseAlpha,
            baseAlpha: baseAlpha,
            pulseSpeed: 0.015 + Math.random() * 0.025,
            pulsePhase: Math.random() * Math.PI * 2
          });
        }
      }
      resize();
      window.addEventListener('resize', resize);

      let tick = 0;
      function draw() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        ctx.clearRect(0, 0, w, h);

        tick += isPlaying ? 0.025 : 0.01;
        const glowScale = isPlaying ? 1 + Math.sin(tick * 2) * 0.08 : 0.95;

        // Radial space gradient
        const grad = ctx.createRadialGradient(
          w * 0.5, h * 0.45, 40 * glowScale,
          w * 0.5, h * 0.45, Math.max(w, h) * 0.75
        );
        grad.addColorStop(0, isPlaying ? 'rgba(16, 185, 129, 0.08)' : 'rgba(16, 185, 129, 0.035)');
        grad.addColorStop(0.45, 'rgba(6, 28, 16, 0.04)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0.98)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx * (isPlaying ? 1.3 : 0.9);
          p.y += p.vy * (isPlaying ? 1.3 : 0.9);

          if (p.x < -10) p.x = w + 10;
          if (p.x > w + 10) p.x = -10;
          if (p.y < -10) p.y = h + 10;
          if (p.y > h + 10) p.y = -10;

          p.pulsePhase += p.pulseSpeed;
          p.alpha = p.baseAlpha + Math.sin(p.pulsePhase) * 0.12;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(16, 185, 129, ' + Math.max(0.06, p.alpha * (isPlaying ? 1.2 : 0.8)) + ')';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = isPlaying ? 9 : 4;
          ctx.fill();
          ctx.shadowBlur = 0;

          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dx = p.x - p2.x;
            const dy = p.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 90) {
              const lineAlpha = (1 - dist / 90) * (isPlaying ? 0.14 : 0.07);
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = 'rgba(16, 185, 129, ' + lineAlpha + ')';
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // 2. High-Precision Spectrum Visualizer
    const oscCanvas = document.getElementById('oscCanvas');
    const oscCtx = oscCanvas.getContext('2d');
    let synthPhase = 0;
    const bufLen = 64;
    const dataArray = new Uint8Array(bufLen);
    const smoothedArray = new Float32Array(bufLen);
    const peakBars = new Float32Array(bufLen);

    function resizeOsc() {
      const rect = oscCanvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      oscCanvas.width = rect.width * dpr;
      oscCanvas.height = rect.height * dpr;
      oscCtx.resetTransform();
      oscCtx.scale(dpr, dpr);
    }
    resizeOsc();
    window.addEventListener('resize', resizeOsc);

    function renderOsc() {
      requestAnimationFrame(renderOsc);
      const rect = oscCanvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      if (!w || !h) return;

      oscCtx.clearRect(0, 0, w, h);

      // CRT Grid
      oscCtx.lineWidth = 0.5;
      oscCtx.strokeStyle = 'rgba(16, 185, 129, 0.08)';
      const stepX = w / 8;
      for (let x = stepX; x < w; x += stepX) {
        oscCtx.beginPath();
        oscCtx.moveTo(x, 0);
        oscCtx.lineTo(x, h);
        oscCtx.stroke();
      }
      const midY = h / 2;
      const stepY = h / 4;
      for (let y = stepY; y < h; y += stepY) {
        oscCtx.beginPath();
        oscCtx.moveTo(0, y);
        oscCtx.lineTo(w, y);
        oscCtx.stroke();
      }

      if (isPlaying) {
        let hasRealSignal = false;
        let totalEnergy = 0;

        if (analyser) {
          try {
            analyser.getByteFrequencyData(dataArray);
            for (let i = 0; i < bufLen; i++) {
              totalEnergy += dataArray[i];
              if (dataArray[i] > 2) hasRealSignal = true;
            }
          } catch(e) {
            hasRealSignal = false;
          }
        }

        const avgEnergy = totalEnergy / bufLen;

        // Dynamic synth backup for transitions or cross-origin safety
        if (!hasRealSignal || avgEnergy < 1.5) {
          synthPhase += 0.055;
          for (let i = 0; i < bufLen; i++) {
            const h1 = Math.sin(i * 0.16 + synthPhase * 1.8) * 45;
            const h2 = Math.cos(i * 0.09 - synthPhase * 1.1) * 30;
            const h3 = Math.sin(i * 0.32 + synthPhase * 2.4) * 20;
            const val = 95 + (h1 + h2 + h3);
            dataArray[i] = Math.max(10, Math.min(240, val));
          }
        }

        for (let i = 0; i < bufLen; i++) {
          const raw = dataArray[i];
          const tilt = 1.0 + (i / bufLen) * 0.65;
          const boosted = Math.pow(raw / 255, 0.65) * 255 * tilt;
          smoothedArray[i] += (boosted - smoothedArray[i]) * 0.35;

          if (smoothedArray[i] > peakBars[i]) {
            peakBars[i] = smoothedArray[i];
          } else {
            peakBars[i] = Math.max(0, peakBars[i] - 1.8);
          }
        }

        const barCount = 32;
        const barStep = Math.floor(bufLen / barCount);
        const barWidth = Math.max(2, (w / barCount) - 2.5);
        const energyRatio = Math.min(1, Math.max(0.2, (hasRealSignal ? avgEnergy : 100) / 75));

        // Frequency Bars
        for (let b = 0; b < barCount; b++) {
          const dataIdx = b * barStep;
          const val = Math.min(255, smoothedArray[dataIdx]) / 255;
          const peakVal = Math.min(255, peakBars[dataIdx]) / 255;
          const barHeight = Math.max(3, val * (h * 0.78));
          const peakY = h - Math.max(4, peakVal * (h * 0.78) + 3);
          const x = b * (barWidth + 2.5) + 2;
          const y = h - barHeight;

          const colGrad = oscCtx.createLinearGradient(0, y, 0, h);
          colGrad.addColorStop(0, 'rgba(52, 211, 153, 0.85)');
          colGrad.addColorStop(0.4, 'rgba(16, 185, 129, 0.45)');
          colGrad.addColorStop(1, 'rgba(6, 78, 59, 0.05)');

          oscCtx.fillStyle = colGrad;
          oscCtx.beginPath();
          if (oscCtx.roundRect) {
            oscCtx.roundRect(x, y, barWidth, barHeight, [2, 2, 0, 0]);
          } else {
            oscCtx.rect(x, y, barWidth, barHeight);
          }
          oscCtx.fill();

          // Peak cap
          oscCtx.fillStyle = '#34d399';
          oscCtx.shadowColor = '#10b981';
          oscCtx.shadowBlur = 6;
          oscCtx.beginPath();
          oscCtx.rect(x, peakY, barWidth, 1.8);
          oscCtx.fill();
          oscCtx.shadowBlur = 0;
        }

        // Overlay Smooth Wave Trace
        const sliceWidth = w / (bufLen - 1);
        oscCtx.lineWidth = 1.8;
        oscCtx.strokeStyle = '#34d399';
        oscCtx.shadowColor = '#10b981';
        oscCtx.shadowBlur = 8 + energyRatio * 8;

        oscCtx.beginPath();
        let curX = 0;
        for (let i = 0; i < bufLen; i++) {
          const v = Math.min(255, smoothedArray[i]) / 255;
          const y = Math.max(4, Math.min(h - 4, h - (v * (h * 0.82) + 6)));
          if (i === 0) oscCtx.moveTo(curX, y);
          else oscCtx.lineTo(curX, y);
          curX += sliceWidth;
        }
        oscCtx.stroke();
        oscCtx.shadowBlur = 0;
      } else {
        // Paused clean horizon line with gentle standby idle breath
        synthPhase += 0.03;
        const pulse = Math.sin(synthPhase) * 2;
        oscCtx.lineWidth = 1.5;
        oscCtx.strokeStyle = 'rgba(16, 185, 129, 0.35)';
        oscCtx.shadowColor = '#10b981';
        oscCtx.shadowBlur = 6;
        oscCtx.beginPath();
        oscCtx.moveTo(0, midY + pulse);
        oscCtx.lineTo(w, midY + pulse);
        oscCtx.stroke();
        oscCtx.shadowBlur = 0;
      }
    }
    renderOsc();

    function formatTime(s) {
      if (isNaN(s) || s < 0) return '00:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    }

    function initAudio() {
      if (!audioCtx) {
        try {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (AudioCtxClass) {
            audioCtx = new AudioCtxClass();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            analyser.minDecibels = -90;
            analyser.maxDecibels = -15;
            analyser.smoothingTimeConstant = 0.7;
            if (!sourceConnected) {
              const src = audioCtx.createMediaElementSource(audioEl);
              src.connect(analyser);
              analyser.connect(audioCtx.destination);
              sourceConnected = true;
            }
          }
        } catch(e) {}
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function renderPlaylist() {
      playlistItems.innerHTML = '';
      TRACKS.forEach((track, idx) => {
        const isActive = idx === currentIndex;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'track-row' + (isActive ? ' active' : '');
        btn.onclick = () => selectTrack(idx, true);

        const leftDiv = document.createElement('div');
        leftDiv.className = 'track-row-left';

        const numSpan = document.createElement('span');
        numSpan.className = 'track-idx';
        numSpan.textContent = String(idx + 1).padStart(2, '0');

        const labelSpan = document.createElement('span');
        labelSpan.className = 'track-title';
        labelSpan.textContent = track.title;

        leftDiv.appendChild(numSpan);
        leftDiv.appendChild(labelSpan);
        btn.appendChild(leftDiv);

        if (isActive) {
          const rightDiv = document.createElement('div');
          rightDiv.style.display = 'flex';
          rightDiv.style.alignItems = 'center';
          rightDiv.style.gap = '6px';
          rightDiv.style.flexShrink = '0';

          if (isPlaying) {
            const eq = document.createElement('div');
            eq.className = 'eq-anim';
            eq.innerHTML = '<div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>';
            rightDiv.appendChild(eq);
          }

          const stateSpan = document.createElement('span');
          stateSpan.style.cssText = 'font-family:"JetBrains Mono",monospace;font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:4px;background:#000;color:#34d399;letter-spacing:1px;';
          stateSpan.textContent = isPlaying ? 'PLAY' : 'PAUSE';
          rightDiv.appendChild(stateSpan);
          btn.appendChild(rightDiv);
        } else {
          const playHint = document.createElement('span');
          playHint.style.cssText = 'font-family:"JetBrains Mono",monospace;font-size:9px;color:rgba(52,211,153,0.5);font-weight:700;flex-shrink:0;';
          playHint.textContent = 'PLAY >';
          btn.appendChild(playHint);
        }

        playlistItems.appendChild(btn);
      });
    }

    function updateTrackUI() {
      const current = TRACKS[currentIndex];
      const counter = String(currentIndex + 1).padStart(2, '0') + ' / ' + String(TRACKS.length).padStart(2, '0');
      trackName.textContent = current.title;
      trackCount.textContent = counter;
      playlistCounter.textContent = counter;
      renderPlaylist();
    }

    function setPlaybackState(playing) {
      isPlaying = playing;
      if (playing) {
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        statusText.textContent = 'ONLINE';
        statusDot.classList.add('live');
        headerDot.classList.add('active');
        livePill.textContent = 'LIVE';
        livePill.classList.add('live');
        oscDot.style.opacity = '1';
      } else {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        statusText.textContent = 'STANDBY';
        statusDot.classList.remove('live');
        headerDot.classList.remove('active');
        livePill.textContent = 'STANDBY';
        livePill.classList.remove('live');
        oscDot.style.opacity = '0.35';
      }
      renderPlaylist();
    }

    function selectTrack(idx, shouldPlay = true) {
      currentIndex = (idx + TRACKS.length) % TRACKS.length;
      audioEl.src = TRACKS[currentIndex].url;
      audioEl.load();
      updateTrackUI();
      if (shouldPlay) {
        initAudio();
        statusText.textContent = 'BUFFERING';
        audioEl.play().then(() => {
          setPlaybackState(true);
        }).catch(() => {
          setPlaybackState(false);
        });
      } else {
        setPlaybackState(false);
      }
    }

    function togglePlay() {
      initAudio();
      if (isPlaying) {
        audioEl.pause();
        setPlaybackState(false);
      } else {
        if (!audioEl.src || audioEl.src === window.location.href) {
          audioEl.src = TRACKS[currentIndex].url;
          audioEl.load();
        }
        statusText.textContent = 'BUFFERING';
        audioEl.play().then(() => {
          setPlaybackState(true);
        }).catch(() => {
          setPlaybackState(false);
        });
      }
    }

    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', () => selectTrack(currentIndex - 1, isPlaying));
    nextBtn.addEventListener('click', () => selectTrack(currentIndex + 1, isPlaying));

    audioEl.addEventListener('timeupdate', () => {
      if (!isSeeking && audioEl.duration) {
        const pct = (audioEl.currentTime / audioEl.duration) * 100;
        progressFill.style.width = pct + '%';
        progressThumb.style.left = pct + '%';
        timeCurrent.textContent = formatTime(audioEl.currentTime);
      }
    });

    audioEl.addEventListener('loadedmetadata', () => {
      timeTotal.textContent = formatTime(audioEl.duration);
    });

    audioEl.addEventListener('ended', () => {
      selectTrack(currentIndex + 1, true);
    });

    audioEl.addEventListener('playing', () => setPlaybackState(true));
    audioEl.addEventListener('pause', () => setPlaybackState(false));

    function seek(e) {
      const rect = progressGroove.getBoundingClientRect();
      const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      if (audioEl.duration) {
        const t = ratio * audioEl.duration;
        audioEl.currentTime = t;
        timeCurrent.textContent = formatTime(t);
        progressFill.style.width = (ratio * 100) + '%';
        progressThumb.style.left = (ratio * 100) + '%';
      }
    }

    // Mouse & Touch scrub events
    progressGroove.addEventListener('mousedown', (e) => {
      isSeeking = true;
      seek(e);
    });
    window.addEventListener('mousemove', (e) => {
      if (isSeeking) seek(e);
    });
    window.addEventListener('mouseup', () => {
      if (isSeeking) isSeeking = false;
    });

    progressGroove.addEventListener('touchstart', (e) => {
      isSeeking = true;
      seek(e);
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (isSeeking) seek(e);
    }, { passive: true });
    window.addEventListener('touchend', () => {
      if (isSeeking) isSeeking = false;
    });

    // Initial state setup
    selectTrack(0, false);
  </script>
</body>
</html>
